name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate README and Structure
        run: |
          test -f README.md
          test $(wc -l < README.md) -ge 20
          echo "Offline field operations structure validation OK"
