name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate README and Structure
        run: |
          test -f README.md
          test $(wc -l < README.md) -ge 20
          echo "Offline field operations structure validation OK"
