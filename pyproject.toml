[project]
name = "castuo-slice"
version = "0.1.0"
description = "Vertical Slice 01 — inventario, deteccion y trazabilidad con evidencia verificable"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requiere PostgreSQL real"]
addopts = "-q --strict-markers"
