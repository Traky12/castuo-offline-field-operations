# PostgreSQL de pruebas. Las invariantes de este slice viven en el motor, así que las
# pruebas necesitan PostgreSQL real: con SQLite estaríamos comprobando otra cosa.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: castuo_test
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d castuo_test"]
      interval: 2s
      timeout: 3s
      retries: 20
